<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljsTheme">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Collapsible Sleek Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="currentColor"/>
            </svg>
          </div>
          <span class="brand-name">ChatAI</span>
        </div>

        <button id="newChatBtn" class="new-chat-btn" title="New conversation (Ctrl+K)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New chat</span>
          <kbd class="shortcut-kbd">Ctrl K</kbd>
        </button>
      </div>

      <div class="sidebar-body">
        <!-- Persona Selector -->
        <div class="persona-section">
          <label class="sidebar-label" for="personaSelect">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Persona</span>
          </label>
          <div class="select-box">
            <select id="personaSelect" class="clean-select">
              <option value="helpful">Helpful Assistant</option>
              <option value="coder">Software Architect</option>
              <option value="tutor">Technical Mentor</option>
              <option value="analyst">Research Analyst</option>
              <option value="creative">Creative Writer</option>
              <option value="custom">Custom Persona...</option>
            </select>
          </div>
          <div id="customPromptContainer" class="custom-prompt-container hidden">
            <textarea id="customPromptInput" rows="2" placeholder="Custom instructions..."></textarea>
          </div>
        </div>

        <!-- Chat History List -->
        <div class="history-section">
          <div class="sidebar-heading-row">
            <span class="sidebar-heading">Conversations</span>
            <span id="sessionCountBadge" class="history-count">0</span>
          </div>
          <div id="sessionsList" class="sessions-list">
            <div class="sessions-empty">No conversations yet</div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="footer-status" title="Hybrid Failover Active">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Connecting...</span>
        </div>
        <button id="themeToggleBtn" class="theme-btn" title="Toggle appearance">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      <!-- Minimalist Top Navbar -->
      <header class="top-nav">
        <div class="nav-left">
          <button id="toggleSidebarBtn" class="icon-button" aria-label="Toggle sidebar" title="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <div class="chat-title-group">
            <h1 class="chat-title" id="activeChatTitle">New chat</h1>
          </div>
        </div>

        <div class="nav-right">
          <!-- Active Model / Hybrid Engine Selector -->
          <div class="model-badge" id="activeModelLabel">
            <span class="badge-dot"></span>
            <select id="providerSelect" class="provider-select" title="Select AI Engine">
              <option value="auto" selected>Auto (Groq + Gemini)</option>
              <option value="groq">Groq Cloud</option>
              <option value="gemini">Google Gemini</option>
              <option value="openai">OpenAI</option>
            </select>
            <svg class="badge-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <!-- Export Dropdown -->
          <div class="dropdown-wrapper">
            <button id="exportBtn" class="icon-button" title="Export conversation">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
            <div id="exportMenu" class="dropdown-popover hidden">
              <button class="popover-item" id="exportMdBtn">Export Markdown (.md)</button>
              <button class="popover-item" id="exportJsonBtn">Export JSON (.json)</button>
            </div>
          </div>

          <!-- Clear Current Chat -->
          <button id="clearChatBtn" class="icon-button" title="Clear chat messages">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Message Stream -->
      <section id="chatFeed" class="chat-feed">
        <!-- Clean Hero Welcome (shown only when conversation is empty) -->
        <div id="welcomeScreen" class="welcome-screen">
          <div class="welcome-emblem">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4L12 2Z" fill="url(#sparkGrad)"/>
              <defs>
                <linearGradient id="sparkGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3b82f6" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2 class="welcome-title">What can I help with?</h2>
          <p class="welcome-subtitle">Ask questions, write code, or explore ideas.</p>
          
          <div class="prompt-grid">
            <button class="prompt-card" data-prompt="Explain how sliding-window context memory prevents token overflow in LLMs.">
              <div class="prompt-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
              </div>
              <div class="prompt-card-content">
                <span class="prompt-card-title">Context & Memory</span>
                <span class="prompt-card-desc">How sliding-window prevents token overflow</span>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Write a Python function with type hints to validate email addresses using regex.">
              <div class="prompt-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
              </div>
              <div class="prompt-card-content">
                <span class="prompt-card-title">Regex Validator</span>
                <span class="prompt-card-desc">Python email validation with test cases</span>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Compare REST APIs vs WebSockets vs Server-Sent Events with practical tradeoffs.">
              <div class="prompt-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                  <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                  <line x1="6" y1="6" x2="6.01" y2="6"></line>
                  <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
              </div>
              <div class="prompt-card-content">
                <span class="prompt-card-title">System Architecture</span>
                <span class="prompt-card-desc">REST vs WebSockets vs SSE tradeoffs</span>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Remember that my name is Alex and I am testing conversation memory.">
              <div class="prompt-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a5 5 0 0 1 5 5c0 2.21-1.79 4-4 4h-2a4 4 0 0 0-4 4v1"></path>
                  <circle cx="12" cy="19" r="1"></circle>
                </svg>
              </div>
              <div class="prompt-card-content">
                <span class="prompt-card-title">Memory Retention</span>
                <span class="prompt-card-desc">Test multi-turn conversational memory</span>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- Floating Modern Composer -->
      <footer class="composer-container">
        <form id="chatForm" class="composer-form">
          <div class="composer-box" id="composerBox">
            <!-- Voice Input Button -->
            <button type="button" id="voiceBtn" class="composer-icon-btn voice-btn" title="Voice Input" aria-label="Record voice">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <!-- Auto-expanding Textarea -->
            <textarea
              id="messageInput"
              placeholder="Ask anything..."
              rows="1"
              maxlength="4000"
              required
            ></textarea>

            <!-- Send Action Button -->
            <button type="submit" id="sendBtn" class="send-action-btn" aria-label="Send message" title="Send (Enter)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>

            <!-- Voice Listening Status Indicator -->
            <div id="voiceStatus" class="voice-badge hidden">
              <span class="voice-dot"></span>
              <span>Listening...</span>
            </div>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- Non-intrusive Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
